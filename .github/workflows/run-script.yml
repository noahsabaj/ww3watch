name: Run script

# Generic one-off runner for repo scripts that need production secrets
# (backfills, data fixes). Maintainer-only by nature of workflow_dispatch.
#   gh workflow run run-script.yml -f script=scripts/backfill-signals.ts
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Path to the script (e.g. scripts/backfill-signals.ts)'
        required: true
        type: string

# Queued with the pipeline so two writers never race, except the photo checks,
# which write only image_verdict / image_hash (nothing else touches them). In
# the pipeline's queue one waited behind each run and was then bumped by the
# next scheduled one, twice.
concurrency:
  group: ${{ (inputs.script == 'scripts/check-photos.ts' || inputs.script == 'scripts/recheck-photos.ts') && 'ww3watch-photo-check' || 'ww3watch-pipeline' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --import tsx "${{ inputs.script }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          # The pipeline's fetch proxy: without it a backfill cannot read what
          # the pipeline read. Newsroom CDNs refuse datacenter IPs, and the
          # photo recheck (#177) left 9 known graphics shown because of it.
          FEED_PROXY_URL: ${{ secrets.FEED_PROXY_URL }}
          FEED_PROXY_SECRET: ${{ secrets.FEED_PROXY_SECRET }}
