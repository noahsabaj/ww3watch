name: Ingestion pipeline

# Fetches RSS feeds, classifies + clusters, and writes to Supabase.
# Replaces the old Vercel cron + cron-job.org trigger. Runs on a Node runner so
# rss-parser and the rest of the npm pipeline work natively (no edge runtime).
#
# CADENCE: each run dispatches the next one (the "Chain the next run" step),
# paced to CADENCE_SECONDS between job starts. The schedule below is only the
# backstop that restarts the chain if it ever breaks (a cancelled run, a
# workflow edit, an Actions outage). GitHub throttles busy crons hard: the
# '*/15' schedule alone fired ~7 times a day (2–4 h gaps, measured over
# Sept 8–13 2026), so "real-time" ingestion had hours of latency.
on:
  schedule:
    - cron: '*/15 * * * *' # backstop only — see CADENCE above
  workflow_dispatch: {} # manual "Run workflow" button, and the chain's own trigger

env:
  # Target seconds between consecutive job starts. The chain step sleeps the
  # remainder of this after the run's work, so a quick run doesn't turn into a
  # tight loop of LLM calls — and a slow one dispatches immediately.
  CADENCE_SECONDS: 900

concurrency:
  group: ww3watch-pipeline
  cancel-in-progress: false # never interrupt an in-flight ingestion run

# contents: checkout; issues: file/append the pipeline-failure alert; actions:
# re-arm scheduled workflows against GitHub's 60-day inactivity auto-disable.
permissions:
  contents: read
  issues: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    # BACKSTOP, not the operative limit. The run bounds itself with RUN_BUDGET_MS
    # / CLASSIFY_BUDGET_MS below and defers whatever doesn't fit, so it should
    # finish well inside this. If this timeout ever fires again, something is
    # ignoring its budget — and it now alerts, because a timeout reports
    # "cancelled" and the alert step below no longer keys on failure() alone.
    # Must cover setup + the run budget + the chain step's pacing sleep, which
    # is CADENCE_SECONDS measured from job start (so at most ~15 min total
    # before the dispatch, plus setup).
    timeout-minutes: 20
    steps:
      - id: clock
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Embedding model cache. Restore/save are split on purpose: the save step
      # is gated on the sentinel embeddings.ts writes only after a successful
      # init + smoke embed — a partial download must never poison the immutable
      # key (that would mean re-downloading from HF ~96×/day, or worse, a
      # truncated ONNX failing clustering on every run).
      - id: model-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ww3watch-transformers
          key: me5b-q8-1ec9243

      - id: run
        run: npm run pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          # gpt-oss thinks before answering, spending completion tokens; 'low'
          # keeps that spend inside the classify/trending max_tokens budgets.
          LLM_REASONING_EFFORT: low
          # Groq free tier is ~6K tokens/min — keep call starts sparse so heavy
          # runs don't live in 429 backoff (which leaks junk through the keyword path).
          LLM_MAX_RPM: '2'
          # Optional: TypeSafe Jev as a routing tier between the local head and
          # the LLM (src/lib/server/jev-classify.ts). Unset → tier is skipped.
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          # '1' retires the LLM as a classifier (see jev-classify.ts). Repo variable.
          JEV_FINAL: ${{ vars.JEV_FINAL }}
          # Optional: classification on its own provider, so its token spend
          # (~all of the pipeline's) stops competing with trending for one daily
          # cap. Unset secrets arrive as empty strings and fall back to LLM_*.
          CLASSIFY_LLM_BASE_URL: ${{ secrets.CLASSIFY_LLM_BASE_URL }}
          CLASSIFY_LLM_API_KEY: ${{ secrets.CLASSIFY_LLM_API_KEY }}
          CLASSIFY_LLM_MODEL: ${{ secrets.CLASSIFY_LLM_MODEL }}
          CLASSIFY_LLM_MAX_RPM: ${{ vars.CLASSIFY_LLM_MAX_RPM }}
          # The run's own wall-clock budget, kept under timeout-minutes above.
          # Classify stops STARTING batches at CLASSIFY_BUDGET_MS and defers the
          # rest (they stay "new"), so the run always reaches the upsert. Before
          # this, a run that overran was killed mid-classify having written
          # nothing — so the same backlog returned every run and 38 of 40
          # consecutive runs died the same way.
          RUN_BUDGET_MS: '900000'      # 15 min
          CLASSIFY_BUDGET_MS: '540000' # 9 min, leaving room for embed/cluster/trending
          # Optional: route WAF-blocked feeds through the Cloudflare proxy.
          FEED_PROXY_URL: ${{ secrets.FEED_PROXY_URL }}
          FEED_PROXY_SECRET: ${{ secrets.FEED_PROXY_SECRET }}
          # Optional: authenticated HF downloads at model-cache miss (shared
          # runner IPs risk anonymous 429s), and an emergency threshold knob.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          EMBED_SIM_THRESHOLD: ${{ vars.EMBED_SIM_THRESHOLD }}

      - id: model-ok
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          if ls ~/.cache/ww3watch-transformers/.ok-* >/dev/null 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.model-ok.outputs.ok == 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/ww3watch-transformers
          key: me5b-q8-1ec9243

      # Push, don't pull: the freshness readout requires someone to LOOK at the
      # site. File (or append to) a single pipeline-failure issue so breakage
      # emails the maintainer. The pipeline self-fails on zero feeds, a total
      # LLM outage, and a >450MB DB — all route here.
      # `failure() || cancelled()`, not `failure()`. A job killed by
      # timeout-minutes reports conclusion CANCELLED, for which failure() is
      # false — so the alert was skipped on the one failure mode that has been
      # dominating: 38 of the last 40 scheduled runs hit the 20-minute timeout
      # and none of them said anything. The freshness readout went red and the
      # push alert, which exists precisely because "the pipeline once died
      # silently for three months", could not fire.
      - name: Alert on failure
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create pipeline-failure --color B60205 --description "Ingestion pipeline failure" --force >/dev/null 2>&1 || true
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --label pipeline-failure --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Pipeline run failed again: $run_url"
          else
            gh issue create --title "Ingestion pipeline failing" --label pipeline-failure \
              --body "The ingestion pipeline failed — see $run_url. The issue will automatically close on a subsequent successful run, or repeat failures will append here."
          fi

      # A source the run just switched off (AUTO_DISABLE_AFTER consecutive
      # failures) needs a person: a moved feed URL, a WAF that now blocks the
      # runner and proxy alike, or a dead outlet. One feed-health issue collects
      # them; curation is SQL against the sources table, then close it.
      - name: File feed-health issue for auto-disabled sources
        if: ${{ !cancelled() && steps.run.outputs.disabled_sources != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DISABLED: ${{ steps.run.outputs.disabled_sources }}
        run: |
          gh label create feed-health --color FBCA04 --description "Feed sources needing re-curation" --force >/dev/null 2>&1 || true
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body=$(printf 'Auto-disabled after %s consecutive failed fetches (run %s):\n\n%s\n\nFix the feed URL or leave it disabled; re-enable with SQL on the sources table.' "200" "$run_url" "$(echo "$DISABLED" | sed 's/^/- /')")
          existing=$(gh issue list --label feed-health --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Feed sources auto-disabled — re-curation needed" --label feed-health --body "$body"
          fi

      - name: Resolve alert on success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --label pipeline-failure --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$existing" ]; then
            run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            gh issue close "$existing" --comment "Pipeline run succeeded: $run_url. Auto-closing issue." --reason "completed"
          fi


      # Self-chain: dispatch the next run, paced to CADENCE_SECONDS from THIS
      # job's start. Runs on failure too — a broken LLM must not also stop
      # ingestion (the alert above already fired) — but not on cancellation,
      # which is how a person stops the chain. The concurrency group keeps it
      # to one chain: GitHub holds at most one pending run per group, so a
      # backstop schedule firing while a chained run is pending just replaces
      # it. workflow_dispatch is one of the two events GITHUB_TOKEN may trigger.
      - name: Chain the next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          elapsed=$(( $(date +%s) - ${{ steps.clock.outputs.start }} ))
          wait=$(( CADENCE_SECONDS - elapsed ))
          if [ "$wait" -gt 0 ]; then
            echo "[chain] run took ${elapsed}s; sleeping ${wait}s to pace the next start"
            sleep "$wait"
          fi
          gh workflow run pipeline.yml --ref "${{ github.ref_name }}" && echo "[chain] dispatched the next run"

      # GitHub disables scheduled workflows after 60 days of repo inactivity;
      # re-enabling via the API resets that timer without a dummy commit. Gated
      # to ~once a week (Monday, hour 00 UTC) so it's a handful of idempotent
      # calls, not one per 15-min run. (backup.yml's weekly commit also resets it.)
      # Not gated on the schedule event any more: chained runs are
      # workflow_dispatch, and with a run every 15 min one of them always lands
      # in the Monday 00:xx window.
      - name: Keepalive — re-arm scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%u)" = "1" ] && [ "$(date -u +%H)" = "00" ]; then
            for wf in pipeline.yml backup.yml; do
              gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable" >/dev/null 2>&1 || true
            done
            echo "[keepalive] re-armed pipeline.yml + backup.yml"
          fi
