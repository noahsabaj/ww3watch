name: Train relevance head

# Retrains the local relevance head (data/classifier-me5b.json) from the LLM's
# accumulated verdicts and commits the weights when they change. Monthly, plus
# on demand — the label pool turns over (rejects are retained 14 days,
# articles 30), so a monthly fit tracks the news cycle without chasing it.
#
# The script refuses to write weights that fail its own guardrails (see
# scripts/train-classifier.ts), so a bad fit fails this job instead of shipping.
on:
  schedule:
    - cron: '17 3 1 * *' # 03:17 UTC on the 1st
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Same immutable model cache key as pipeline.yml (restore only — the
      # pipeline owns the save).
      - uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ww3watch-transformers
          key: me5b-q8-1ec9243
      - run: node --import tsx scripts/train-classifier.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/classifier-me5b.json
          if git diff --cached --quiet; then
            echo "weights unchanged"
          else
            git commit -m "chore: retrain relevance head"
            git push
          fi
