name: Train relevance head

# Retrains the local relevance head (data/classifier-me5b.json) from Jev's
# accumulated verdicts and commits the weights when they change. Monthly, plus
# on demand — the label pool turns over (rejects are retained 14 days,
# articles 30), so a monthly fit tracks the news cycle without chasing it.
#
# The script refuses to write weights that fail its own guardrails (see
# scripts/train-classifier.ts), so a bad fit fails this job instead of shipping.
on:
  schedule:
    - cron: '17 3 1 * *' # 03:17 UTC on the 1st
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Same immutable model cache key as pipeline.yml (restore only — the
      # pipeline owns the save).
      - uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ww3watch-transformers
          key: me5b-q8-1ec9243
      - run: node --import tsx scripts/train-classifier.ts | tee train.log
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      # main is protected (PR + required checks), so the weights go up as a PR
      # on a fixed branch: one open PR at a time, force-updated by each retrain,
      # with the holdout metrics as its body so the reviewer sees what changed.
      - name: Open or update the retrain PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data/classifier-me5b.json
          if git diff --cached --quiet; then
            echo "weights unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B retrain-head
          git commit -m "chore: retrain relevance head"
          git push --force origin retrain-head
          # Reuse the OPEN PR (rewriting its body) or create one. The lookup
          # lives in scripts/ci/bot-pr.ts, under test, because it has been wrong
          # before: `gh pr view <branch>` also matches a MERGED PR, so the second
          # retrain ever run edited the first one's closed PR and never opened
          # its own. The body travels by env, not argv — it is multi-line.
          PR_BODY=$(sed -n '/^## Relevance head/,$p' train.log)
          export PR_BODY
          node --import tsx scripts/ci/bot-pr.ts ensure --branch retrain-head \
            --title "chore: retrain relevance head" --if-open edit
