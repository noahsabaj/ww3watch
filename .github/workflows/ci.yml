name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # The README "Tuning" table is generated from src/lib/server/config.ts.
      - run: node --import tsx scripts/gen-config-docs.ts --check
      - run: npm run check
        env:
          # svelte-check needs these at build/import time; dummies are fine for type-checking.
          PUBLIC_SUPABASE_URL: https://example.supabase.co
          PUBLIC_SUPABASE_ANON_KEY: dummy

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      # The suite runs against a SEEDED local backend, not production. Asserting
      # against live data meant a PR went red when the ingestion pipeline was
      # having a bad morning, and a red CI that might not be your fault is a red
      # CI nobody reads. The deployed site keeps its own watchdog in
      # prod-smoke.yml.
      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # `supabase start` would apply supabase/migrations itself. A later step does
      # that explicitly instead — file by file with ON_ERROR_STOP, so a failure
      # names the file — so the directory is hidden from the CLI's own pass.
      #
      # Started first and in the background: pulling and booting the stack is
      # the slowest part of this job (~50s), and installing packages, the site
      # build and the browser install below need no database, so they all run
      # meanwhile. "Wait for the local Supabase stack" fails the job if the
      # start failed. Only the services the suite touches
      # are started: the database, its REST API (kong + postgrest), realtime
      # (the feed subscribes), auth (owns the auth schema policies reference)
      # and postgres-meta (type generation). Dashboard, mail, image, storage,
      # edge functions, logging and pooler are left out; nothing here calls them.
      - name: Start the local Supabase stack
        run: |
          mv supabase/migrations /tmp/ww3watch-migrations
          (supabase start -x studio,mailpit,imgproxy,storage-api,edge-runtime,logflare,vector,supavisor > /tmp/supabase-start.log 2>&1; echo $? > /tmp/supabase-start.exit) &

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The browser (and its system libraries) installs in the background while
      # the site builds; neither needs the other.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - name: Install the test browser (background)
        run: (npx playwright install --with-deps chromium > /tmp/playwright-install.log 2>&1; echo $? > /tmp/playwright-install.exit) &

      # The local stack's publishable key is a fixed, well-known constant —
      # every `supabase start` anywhere produces this same value, because the
      # local JWT secret is a documented default. It grants nothing beyond this
      # ephemeral container.
      - run: npm run build
        env:
          PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
      # Replicate deploy.yml's fallback copy so sirv --single serves the SPA.
      - run: test -f build/index.html || cp build/404.html build/index.html
      - name: Wait for the test browser
        run: |
          for _ in $(seq 1 300); do [ -f /tmp/playwright-install.exit ] && break; sleep 1; done
          cat /tmp/playwright-install.log
          [ "$(cat /tmp/playwright-install.exit 2>/dev/null)" = 0 ]

      - name: Wait for the local Supabase stack
        run: |
          for _ in $(seq 1 240); do [ -f /tmp/supabase-start.exit ] && break; sleep 1; done
          cat /tmp/supabase-start.log
          mv /tmp/ww3watch-migrations supabase/migrations
          [ "$(cat /tmp/supabase-start.exit 2>/dev/null)" = 0 ]

      # Filename order is the contract migrations are written and applied under
      # (docs/CONVENTIONS.md): one baseline, then 14-digit versions.
      - name: Apply migrations in filename order, then the fixture seed
        run: |
          set -euo pipefail
          for f in supabase/migrations/*.sql; do
            echo "applying $(basename "$f")"
            docker exec -i supabase_db_ww3watch psql -U postgres -v ON_ERROR_STOP=1 -q < "$f"
          done
          docker exec -i supabase_db_ww3watch psql -U postgres -v ON_ERROR_STOP=1 -q < supabase/seed.sql

      # Every function in `public` is CALLED once (supabase/tests/rpc_smoke.sql).
      # plpgsql bodies are not checked at CREATE time: a function comparing a TEXT
      # column to a UUID shipped, failed on every call in production, and nothing
      # noticed because its caller logs and carries on. The file also fails if a
      # function exists that it does not call.
      - name: RPC smoke test
        run: docker exec -i supabase_db_ww3watch psql -U postgres -v ON_ERROR_STOP=1 -q < supabase/tests/rpc_smoke.sql

      - name: Concurrent budget reservations
        run: node scripts/ops/test-budget-concurrency.mjs

      # Type-check the repo against types generated from THIS database — the one
      # just built from supabase/migrations — not the committed copy. A migration
      # that renames or retypes something a caller uses fails the browser-test
      # step below, which runs the check alongside the suite (they need neither
      # each other nor more than the 4 cores between them). The header comment is
      # re-attached so the file stays self-describing if someone copies it out.
      - name: Generate types from the migrated schema
        run: |
          set -euo pipefail
          head -n 9 src/lib/database.types.ts > /tmp/header.ts
          supabase gen types typescript --local --schema public > /tmp/generated.ts
          cat /tmp/header.ts /tmp/generated.ts > src/lib/database.types.ts
          # The hosted generator adds an `__InternalSupabase` block (PostgREST
          # version) that the local one omits. Compare everything except that, so
          # a warning here always means a real schema difference.
          strip() { sed '/__InternalSupabase: {/,/^  }$/d; /Allows to automatically instantiate createClient/d; /instead of createClient<Database/d' "$1"; }
          git show HEAD:src/lib/database.types.ts > /tmp/committed.ts
          if ! diff -B <(strip /tmp/committed.ts) <(strip src/lib/database.types.ts) > /tmp/types.diff; then
            echo "::warning file=src/lib/database.types.ts::committed types differ from the migrated schema — regenerate (see the file header)"
            cat /tmp/types.diff
          fi

      # The schema these migrations actually build, as an artifact: the canonical
      # answer to "what does a fresh database look like?", diffable across PRs.
      - name: Dump the migrated schema
        run: |
          docker exec supabase_db_ww3watch pg_dump -U postgres --schema-only --no-owner --schema=public --schema=cron > /tmp/schema.sql || docker exec supabase_db_ww3watch pg_dump -U postgres --schema-only --no-owner --schema=public > /tmp/schema.sql
          docker exec supabase_db_ww3watch psql -U postgres -At -c "select 'publication: '||pubname||' <- '||schemaname||'.'||tablename from pg_publication_tables order by 1" > /tmp/publications.txt
          docker exec supabase_db_ww3watch psql -U postgres -At -c "select jobname||' | '||schedule||' | '||command from cron.job order by 1" > /tmp/cron.txt || true
          wc -l /tmp/schema.sql /tmp/publications.txt /tmp/cron.txt
      - uses: actions/upload-artifact@v4
        with:
          name: migrated-schema
          path: |
            /tmp/schema.sql
            /tmp/publications.txt
            /tmp/cron.txt
          retention-days: 14

      - name: Browser tests, and the type-check against the migrated schema
        # svelte-check resolves $env/static/public, so it needs the same two
        # PUBLIC_ values the build step was given.
        env:
          PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
        run: |
          npm run check > /tmp/check.log 2>&1 &
          check=$!
          npx playwright test && tests=0 || tests=$?
          wait "$check" && checked=0 || checked=$?
          echo "::group::Type-check against the migrated schema (exit $checked)"
          cat /tmp/check.log
          echo "::endgroup::"
          if [ "$checked" != 0 ]; then echo "::error::npm run check failed against the migrated schema (log above)"; fi
          [ "$tests" = 0 ] && [ "$checked" = 0 ]

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Type-check the npm-free shared modules (SSRF math, http, hash) — fast and
      # stable. The npm-dependent entrypoints are bundled + deployed by
      # deploy-functions.yml; their pure logic is exercised by the tests below.
      # --no-config: ignore the repo's SvelteKit tsconfig (its module/
      # moduleResolution conflict with Deno's defaults); --node-modules-dir=none:
      # use Deno's own npm cache, not the project's node_modules.
      - run: deno check --no-config --node-modules-dir=none supabase/functions/_shared/net.ts supabase/functions/_shared/http.ts supabase/functions/_shared/hash.ts supabase/functions/_shared/rss.ts supabase/functions/_shared/segments.ts supabase/functions/_shared/extract.ts
      # --allow-net is scoped to [::1] for the SSRF live repro, which binds a real
      # loopback listener and asserts fetchGuarded refuses to reach it. Nothing
      # else in this suite touches the network; keep the scope narrow.
      - run: deno test --no-check --no-config --node-modules-dir=none --allow-net='[::1]' supabase/functions/_shared/
