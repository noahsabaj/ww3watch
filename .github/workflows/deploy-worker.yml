name: Deploy Cloudflare workers

# Two Workers: feed-proxy (cloudflare/feed-proxy.js, RSS fetches for the
# pipeline) and share-card (cloudflare/share-card/, per-story link previews on
# ww3watch.org; it bundles src/lib/share-card.ts and the photo rules it uses).
#
# The feed-proxy Worker previously deployed only via a
# manual dashboard/CLI step, so the repo and the running Worker could silently
# drift. Deploy it automatically whenever cloudflare/** changes on main — merged
# code is the running code. PRs validate the build without deploying.
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - 'src/lib/share-card.ts'
      - 'src/lib/cluster.ts'
      - 'src/lib/utils.ts'
  pull_request:
    paths:
      - 'cloudflare/**'
      - 'src/lib/share-card.ts'
      - 'src/lib/cluster.ts'
      - 'src/lib/utils.ts'
  workflow_dispatch: {}

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v6

      # PRs: build-only validation. No secrets needed, so it runs on forks too.
      - name: Validate (dry-run)
        if: github.event_name == 'pull_request'
        run: |
          npx --yes wrangler@4 deploy --dry-run
          npx --yes wrangler@4 deploy --dry-run --config share-card/wrangler.toml

      # Gate at the SHELL level (the secrets context isn't available in `if:`).
      # Degrades to a warning if the token isn't set yet, so a cloudflare/** change
      # never hard-fails before CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID exist.
      - name: Deploy
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN not set — skipping worker deploy. Add it (and CLOUDFLARE_ACCOUNT_ID) to enable auto-deploy."
            exit 0
          fi
          npx --yes wrangler@4 deploy
          # Public key the site already ships with; the token needs Zone →
          # Workers Routes: Edit on ww3watch.org for the route.
          npx --yes wrangler@4 deploy --config share-card/wrangler.toml --var "SUPABASE_ANON_KEY:$SUPABASE_ANON_KEY"
